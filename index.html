
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BilimTest - Astronomiya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Star Field Background */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .glass {
            background: rgba(13, 17, 23, 0.4);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.02);
        }

        /* 2026 Typography Polish */
        .logo-text {
            font-weight: 900;
            font-style: italic;
            letter-spacing: -0.06em;
            text-transform: uppercase;
        }
        
        .logo-gradient {
            background: linear-gradient(to right, #ffffff 50%, #3b82f6 50%, #2dd4bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: shine 8s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .perspective-2000 {
            perspective: 2000px;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .preserve-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .animate-scanline {
            animation: scanline 4s linear infinite;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.15);
        }

        .transition-all {
            transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="stars-container" id="stars"></div>
    <!-- Tailwind JIT hint: dynamic classes used in JS -->
    <div class="hidden
      bg-blue-500/10 bg-purple-500/10 bg-emerald-500/10 bg-amber-500/10 bg-rose-500/10 bg-fuchsia-500/10 bg-cyan-500/10 bg-lime-500/10 bg-orange-500/10 bg-sky-500/10
      bg-blue-500/20 bg-purple-500/20 bg-emerald-500/20 bg-amber-500/20 bg-rose-500/20 bg-fuchsia-500/20 bg-cyan-500/20 bg-lime-500/20 bg-orange-500/20 bg-sky-500/20
      bg-blue-500 bg-purple-500 bg-emerald-500 bg-amber-500 bg-rose-500 bg-fuchsia-500 bg-cyan-500 bg-lime-500 bg-orange-500 bg-sky-500
      text-blue-400 text-purple-400 text-emerald-400 text-amber-400 text-rose-400 text-fuchsia-400 text-cyan-400 text-lime-400 text-orange-400 text-sky-400
      border-blue-500/20 border-purple-500/20 border-emerald-500/20 border-amber-500/20 border-rose-500/20 border-fuchsia-500/20 border-cyan-500/20 border-lime-500/20 border-orange-500/20 border-sky-500/20
      hover:border-blue-500/50 hover:border-purple-500/50 hover:border-emerald-500/50 hover:border-amber-500/50 hover:border-rose-500/50 hover:border-fuchsia-500/50 hover:border-cyan-500/50 hover:border-lime-500/50 hover:border-orange-500/50 hover:border-sky-500/50
      group-hover:bg-blue-500/70 group-hover:bg-purple-500/70 group-hover:bg-emerald-500/70 group-hover:bg-amber-500/70 group-hover:bg-rose-500/70 group-hover:bg-fuchsia-500/70 group-hover:bg-cyan-500/70 group-hover:bg-lime-500/70 group-hover:bg-orange-500/70 group-hover:bg-sky-500/70
      group-hover:bg-blue-500 group-hover:bg-purple-500 group-hover:bg-emerald-500 group-hover:bg-amber-500 group-hover:bg-rose-500 group-hover:bg-fuchsia-500 group-hover:bg-cyan-500 group-hover:bg-lime-500 group-hover:bg-orange-500 group-hover:bg-sky-500
      group-hover:text-blue-400 group-hover:text-purple-400 group-hover:text-emerald-400 group-hover:text-amber-400 group-hover:text-rose-400 group-hover:text-fuchsia-400 group-hover:text-cyan-400 group-hover:text-lime-400 group-hover:text-orange-400 group-hover:text-sky-400
    "></div>
    <div id="root"></div>
    <script>
        const starsContainer = document.getElementById('stars');
        const starCount = 150;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            star.style.animationDelay = Math.random() * 5 + 's';
            starsContainer.appendChild(star);
        }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
